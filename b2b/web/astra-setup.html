<!doctype html><html lang="en"><meta charset="utf-8"><title>Connect b2b to Astra</title><body><h1>Connect Astra</h1><p>Your API key stays on this local workstation.</p><form><label>OpenAI API key <input type="password" name="key" autocomplete="off" required></label><button>Save key</button></form><p role="status"></p><a href="/">Return to b2b</a><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('input');const r=await fetch('/api/astra/configure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:input.value})});input.value='';document.querySelector('[role=status]').textContent=r.ok?'Astra connected.': 'Could not save the key.';};</script></body></html>
