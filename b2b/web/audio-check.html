<!doctype html><meta charset="utf-8"><title>b2b audio checks</title><pre id="result">Rendering synthetic EQ checks…</pre><script type="module">
import {createChannel,crossfadeGains} from './channel.js';
async function level(frequency,band=null){const ctx=new OfflineAudioContext(1,24000,48000),channel=createChannel(ctx,ctx.destination);if(band)channel[band].gain.value=-12;const oscillator=ctx.createOscillator();oscillator.frequency.value=frequency;oscillator.connect(channel.low);oscillator.start();const buffer=await ctx.startRendering(),data=buffer.getChannelData(0);let power=0;for(let i=12000;i<data.length;i++)power+=data[i]**2;return 10*Math.log10(power/(data.length-12000));}
try{const results=[];for(const [band,hz] of [['low',50],['mid',1000],['high',12000]]){const reference=await level(hz),cut=await level(hz,band),change=cut-reference;if(Math.abs(change+12)>1)throw Error(`${band} cut was ${change}dB`);results.push(`${band} ${hz}Hz: ${change.toFixed(2)} dB`);}const [a,b]=crossfadeGains(.5);if(Math.abs(a*a+b*b-1)>1e-9)throw Error('Crossfade power incorrect');results.push('Equal-power midpoint: 1.000 total power');document.querySelector('#result').textContent='PASS\n'+results.join('\n');}catch(error){document.querySelector('#result').textContent='FAIL '+error.stack;}
</script>
